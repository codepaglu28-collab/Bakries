<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cast Auction logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <radialGradient id="bg" cx="50%" cy="34%" r="75%">
    <stop offset="0%" stop-color="#5e1a35"/>
    <stop offset="55%" stop-color="#3d1220"/>
    <stop offset="100%" stop-color="#2a0b15"/>
  </radialGradient>
  <linearGradient id="split" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#5b8cff"/>
    <stop offset="48%" stop-color="#5b8cff"/>
    <stop offset="52%" stop-color="#ff6a9d"/>
    <stop offset="100%" stop-color="#ff6a9d"/>
  </linearGradient>
  <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffd979"/>
    <stop offset="100%" stop-color="#e79a1f"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
  </filter>
</defs>

<!-- background -->
<circle cx="256" cy="256" r="248" fill="url(#bg)"/>

<!-- spotlight rays, split hero/heroine -->
<g opacity="0.5">
  <path d="M256 90 L120 250 L256 235 Z" fill="#5b8cff" opacity="0.35"/>
  <path d="M256 90 L392 250 L256 235 Z" fill="#ff6a9d" opacity="0.35"/>
</g>

<!-- dotted gold ring, like the marquee poster frame -->
<circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-dasharray="2 18" stroke-linecap="round"/>
<circle cx="256" cy="256" r="200" fill="none" stroke="#fbf3e0" stroke-opacity="0.18" stroke-width="1.5"/>

<!-- arced top text: CAST AUCTION -->
<path id="arcTop" d="M 108 250 A 148 148 0 0 1 404 250" fill="none"/>
<text font-family="'Hanken Grotesk',system-ui,sans-serif" font-size="27" font-weight="700" letter-spacing="6" fill="#f5b83d">
  <textPath href="#arcTop" startOffset="50%" text-anchor="middle">CAST · AUCTION</textPath>
</text>

<!-- central emblem: gavel + star, split hero/heroine colors -->
<g filter="url(#soft)" transform="translate(256,278)">
  <!-- gavel head -->
  <g transform="rotate(-28)">
    <rect x="-54" y="-20" width="108" height="40" rx="10" fill="url(#split)"/>
    <rect x="-54" y="-20" width="108" height="40" rx="10" fill="none" stroke="#1d0710" stroke-opacity="0.25" stroke-width="2"/>
    <rect x="30" y="-8" width="16" height="16" fill="url(#goldGrad)"/>
  </g>
  <!-- gavel handle -->
  <rect x="-10" y="18" width="20" height="92" rx="10" fill="url(#goldGrad)" transform="rotate(-28)"/>
  <!-- sound block -->
  <rect x="-46" y="70" width="92" height="20" rx="6" fill="#1d0710" fill-opacity="0.55"/>

  <!-- rating star above -->
  <g transform="translate(0,-96)">
    <path d="M0 -30 L8.8 -9.3 L31.3 -7.4 L14.2 7.8 L19.4 30 L0 17.8 L-19.4 30 L-14.2 7.8 L-31.3 -7.4 L-8.8 -9.3 Z" fill="url(#goldGrad)"/>
  </g>
</g>

<!-- bottom wordmark -->
<text x="256" y="420" text-anchor="middle" font-family="'Rozha One',Georgia,'Times New Roman',serif" font-size="56" fill="#fbf3e0" letter-spacing="1">Cast Auction</text>
<text x="256" y="446" text-anchor="middle" font-family="'Hanken Grotesk',system-ui,sans-serif" font-size="15" font-weight="500" letter-spacing="3" fill="#cdb9a8">HERO &amp; HEROINE EDITION</text>
</svg>
