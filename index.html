<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cast Auction: Hero and Heroine Auction Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Rozha+One&display=swap" rel="stylesheet">
<style>

:root{
  color-scheme:dark;
  --velvet:#2a0b15; --curtain:#3d1220; --curtain2:#511b2e;
  --line:rgba(251,243,224,.16); --ivory:#fbf3e0; --muted:#cdb9a8;
  --gold:#f5b83d; --hero:#5b8cff; --heroine:#ff6a9d;
  --accent:var(--hero); --danger:#ff7b6b; --ok:#7fe0a5;
  --display:'Rozha One',Georgia,'Times New Roman',serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--velvet);background-image:radial-gradient(90% 46% at 50% 0,#5e1a35 0,transparent 72%);background-repeat:no-repeat;color:var(--ivory);font:400 16px/1.45 var(--body);min-height:100vh}
body[data-mode=heroine]{--accent:var(--heroine)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:620px;margin:0 auto;padding:22px 16px 48px}
.num{font-variant-numeric:tabular-nums}

/* Home */
.brand{font-family:var(--display);font-size:clamp(46px,14vw,76px);line-height:.95;letter-spacing:.005em;margin:6px 0 12px}
.lede{color:var(--muted);max-width:36ch;font-size:17px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0 8px}
.mode{position:relative;text-align:left;padding:16px 14px 16px;border-radius:16px;background:var(--curtain);border:2px solid var(--line);min-height:168px;display:flex;flex-direction:column;gap:6px}
.mode.hero{--mc:var(--hero)} .mode.heroine{--mc:var(--heroine)}
.mode[aria-pressed=true]{border-color:var(--mc);background:var(--curtain2)}
.mode h2{font-family:var(--display);font-size:27px;font-weight:400;line-height:1.05}
.mode .count{font-weight:700;color:var(--mc);font-size:15px}
.mode .inds{color:var(--muted);font-size:14px}
.mode .sel{margin-top:auto;align-self:flex-start;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--mc);color:#1d0710;visibility:hidden}
.mode[aria-pressed=true] .sel{visibility:visible}
.field{margin:22px 0 0}
.field h3{font-size:15px;font-weight:700;margin-bottom:8px}
.field .hint{font-size:13px;color:var(--muted);margin-top:6px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:11px 6px;border-radius:12px;background:var(--curtain);border:1px solid var(--line);font-size:15px}
.seg button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#2a0b15;font-weight:700}
.trow{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:12px;background:var(--curtain);margin-bottom:8px;border-left:7px solid var(--tc)}
.trow .tn{flex:1;min-width:0}
.trow .tn b{display:block;font-size:16px}
.trow .tn span{font-size:13px;color:var(--muted)}
.who{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.who button{padding:8px 12px;font-size:14px;background:transparent}
.who button[aria-pressed=true]{background:var(--tc);color:#1d0710;font-weight:700}
.go{display:block;width:100%;padding:16px;border-radius:14px;background:var(--gold);color:#2a0b15;font-weight:700;font-size:18px;margin-top:22px;text-align:center}
.go:disabled{background:var(--curtain2);color:var(--muted)}
.ghost{display:block;width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);text-align:center;margin-top:10px;font-weight:500}
details{margin-top:22px;background:var(--curtain);border-radius:12px;padding:12px 14px}
summary{cursor:pointer;font-weight:700}
details p,details li{color:var(--muted);font-size:15px;margin-top:8px}
details ul{padding-left:18px;margin:6px 0 0}
.fine{font-size:12.5px;color:var(--muted);margin-top:26px;max-width:52ch}

/* Auction */
.au{padding-bottom:190px}
.au-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.modechip{display:inline-block;font-weight:700;font-size:14px;padding:4px 12px;border-radius:99px;background:var(--accent);color:#1d0710;margin-right:8px}
#lotno{color:var(--muted);font-size:14px}
.pausebtn{padding:8px 16px;border-radius:99px;border:1px solid var(--line);font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 6px;border-radius:12px;background:var(--curtain);font-size:15px;border:1px solid transparent}
.tabs button[aria-selected=true]{border-color:var(--accent);background:var(--curtain2);font-weight:700}
.timer{height:8px;border-radius:99px;background:rgba(251,243,224,.12);overflow:hidden;margin:2px 10px 20px}
.timer i{display:block;height:100%;width:100%;background:var(--gold);border-radius:99px}
.timer.hot i{background:var(--danger)}
.poster{position:relative;margin:0 10px;padding:18px 16px 16px;border-radius:18px;background:var(--curtain)}
.poster::before{content:"";position:absolute;inset:-10px;border:6px dotted var(--gold);border-radius:28px;opacity:.9;pointer-events:none}
.poster.flash::before{animation:bulbs .9s steps(2,end) 3}
@keyframes bulbs{50%{opacity:.15}}
.poster.enter .phead,.poster.enter .stats{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.phead{display:flex;gap:14px;align-items:center}
.mono{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:26px;background:var(--accent);color:#1d0710}
.pname{font-family:var(--display);font-size:clamp(26px,7.5vw,34px);line-height:1.05;flex:1;min-width:0;overflow-wrap:anywhere}
.rate{flex:none;text-align:center;line-height:1}
.rate b{display:block;font-family:var(--display);font-weight:400;font-size:34px;color:var(--gold)}
.rate span{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.tag{font-size:13px;font-weight:500;padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.tag.gold{border-color:var(--gold);color:var(--gold)}
.stats{display:grid;gap:8px;margin:12px 0 10px}
.stat{display:grid;grid-template-columns:104px 1fr 28px;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.stat .bar{height:7px;border-radius:9px;background:rgba(251,243,224,.12);overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.stat .v{text-align:right;color:var(--ivory);font-weight:700}
.base{font-size:14px;color:var(--muted)}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-7deg);text-align:center;padding:12px 26px 14px;border:5px solid var(--tc,var(--ivory));border-radius:14px;background:rgba(42,11,21,.94);animation:slam .26s cubic-bezier(.2,1.2,.4,1);min-width:76%}
.stamp b{display:block;font-family:var(--display);font-weight:400;font-size:52px;line-height:1;color:var(--tc,var(--ivory))}
.stamp span{display:block;font-size:16px;font-weight:700;margin-top:4px}
.stamp small{display:block;color:var(--muted);font-size:14px}
@keyframes slam{from{transform:translate(-50%,-50%) rotate(-7deg) scale(2.3);opacity:0}to{transform:translate(-50%,-50%) rotate(-7deg) scale(1);opacity:1}}
.bidbox{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 10px 0;padding:14px 16px;border-radius:16px;background:var(--curtain)}
.bidamt{font-family:var(--display);font-size:36px;line-height:1}
.bidby{margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700}
.chip i{width:12px;height:12px;border-radius:3px;background:var(--tc)}
.muted{color:var(--muted)}
.clock{flex:none;width:68px;height:68px;border-radius:50%;border:4px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:30px}
.clock.hot{border-color:var(--danger);color:var(--danger)}
.status{min-height:24px;margin:10px 12px 0;font-weight:700;color:var(--gold);text-align:center}
.ticker{list-style:none;margin:8px 12px 0;padding:0;display:grid;gap:4px;font-size:14px;color:var(--muted)}
.ticker li{display:flex;justify-content:space-between;gap:8px}
.ticker li:first-child{color:var(--ivory)}
.nextup{margin:14px 12px 0;font-size:14px;color:var(--muted)}
.pausepanel{margin:16px 10px 0;padding:16px;border-radius:16px;background:var(--curtain2)}
.pausepanel p{font-weight:700;margin-bottom:4px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--velvet) 78%,rgba(42,11,21,0))}
.dock>div{max-width:620px;margin:0 auto;display:grid;gap:8px}
.dock.many>div{grid-template-columns:1fr 1fr}
.bidbtn{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:14px;background:var(--tc);color:#1d0710}
.bidbtn .bn{display:block;font-size:13px;font-weight:700;opacity:.85}
.bidbtn .bl{display:block;font-size:19px;font-weight:700;line-height:1.2}
.bidbtn .bp{display:block;font-size:12.5px;opacity:.8}
.dock.one .bidbtn{text-align:center;padding:12px 14px}
.dock.one .bidbtn .bl{font-size:24px}
.dock.many .bidbtn .bl{font-size:16px}
.bidbtn:disabled{background:var(--curtain2);color:var(--muted);border:2px solid var(--tc)}
.bidbtn:not(:disabled):active{transform:scale(.98)}
.dockteam{display:flex;flex-direction:column;gap:6px}
.skipbtn{display:block;width:100%;text-align:center;padding:8px 12px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.skipbtn[aria-pressed=true]{background:var(--curtain2);color:var(--ivory);border-color:var(--gold)}
.skipbtn:disabled:not([aria-pressed=true]){opacity:.4}
.team{background:var(--curtain);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-left:7px solid var(--tc)}
.team-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.team h3{font-size:17px}
.team-h p{font-size:13px;color:var(--muted)}
.purse{text-align:right;flex:none}
.purse b{display:block;font-size:18px}
.purse span{font-size:13px;color:var(--muted)}
.squad{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}
.squad li{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:5px 0;border-top:1px solid var(--line)}
.squad em{font-style:normal;color:var(--tc);font-weight:700}
.squad .empty{color:var(--muted);border:0}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.log .un{color:var(--muted)}
.log em{font-style:normal;font-weight:700;text-align:right}
.emptymsg{color:var(--muted);padding:24px 4px;text-align:center}

/* End */
.win{padding:22px 18px;border-radius:18px;background:var(--curtain2);border:3px dotted var(--gold);margin:18px 0}
.win h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,42px);line-height:1.05}
.win .sc{font-size:15px;color:var(--muted);margin-top:6px}
.rank{background:var(--curtain);border-radius:14px;margin-bottom:10px;border-left:7px solid var(--tc);padding:0}
.rank summary{display:flex;align-items:center;gap:12px;padding:14px;list-style:none}
.rank summary::-webkit-details-marker{display:none}
.rank .pos{font-family:var(--display);font-size:26px;width:30px;color:var(--gold)}
.rank .rn{flex:1;min-width:0}
.rank .rn b{display:block}
.rank .rn span{font-size:13px;color:var(--muted);font-weight:400}
.rank .tot{font-family:var(--display);font-size:26px}
.rank .body{padding:0 14px 14px}
.break{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;color:var(--muted);margin-bottom:8px}
.break b{color:var(--ivory)}
textarea.copybox{width:100%;height:150px;margin-top:10px;background:var(--curtain);color:var(--ivory);border:1px solid var(--line);border-radius:12px;padding:10px;font:14px/1.4 var(--body)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.stat{grid-template-columns:88px 1fr 26px}.mode h2{font-size:23px}}
.txt{width:100%;padding:13px 14px;border-radius:12px;background:var(--curtain);color:var(--ivory);border:1px solid var(--line);font:500 17px/1.2 var(--body)}
.txt.code{font-family:var(--display);font-size:34px;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:12px}
.notice{margin:14px 0;padding:12px 14px;border-radius:12px;background:var(--curtain2);border-left:5px solid var(--gold);font-size:15px}
.back{padding:8px 0;font-size:15px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.roombox{margin:14px 0 6px;padding:18px 16px;border-radius:18px;background:var(--curtain2);border:3px dotted var(--gold);text-align:center}
.roomcode{font-family:var(--display);font-size:clamp(52px,17vw,84px);line-height:1;letter-spacing:.14em;margin:4px 0 4px;padding-left:.14em}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.pchip{padding:5px 12px;border-radius:99px;background:var(--curtain);border:1px solid var(--line);font-size:14px}
.pchip.me{border-color:var(--accent);font-weight:700}
.pick{padding:8px 12px;border-radius:10px;background:var(--tc);color:#1d0710;font-weight:700;font-size:14px;white-space:nowrap}
.pick.mine{background:transparent;border:2px solid var(--tc);color:var(--ivory)}
.owner{font-size:14px;font-weight:700;color:var(--tc);text-align:right;max-width:9em;overflow-wrap:anywhere}
.waiting{margin-top:22px;padding:16px;text-align:center;border-radius:14px;background:var(--curtain);color:var(--muted)}
.watch{text-align:center;color:var(--muted);padding:10px 0;font-size:15px}
.sumline{color:var(--muted);font-size:15px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--curtain)}
.stepper button{flex:none;width:68px;height:54px;font-size:28px;font-weight:700;background:var(--curtain2);line-height:1}
.stepper button:disabled{opacity:.3}
.stepper output{flex:1;text-align:center;font-family:var(--display);font-size:30px}
</style>
</head>
<body data-mode="hero">
<main id="app" class="wrap"></main>

function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}

/* Host side */
function hostRoom(){
  const Peer=PeerClass();
  if(!Peer){S.notice='Online rooms need PeerJS, which did not load in this browser.';renderHome();return}
  cleanupNet();
  S.role='host';S.gone=false;S.me={id:'host',name:readName()};
  S.players=[{id:'host',name:S.me.name}];
  S.claims=Array(TEAMS.length).fill(null);S.claims[0]='host';
  app.innerHTML='<div class="notice" role="status">Creating your room…</div>';
  openPeer(0);
}
function openPeer(tries){
  const Peer=PeerClass(),code=makeCode();
  const peer=new Peer('castauction-'+code);
  S.net.peer=peer;
  let opened=false;
  const to=setTimeout(()=>{if(!opened)hostFail('Could not reach the matchmaking service. Check your connection and try again.')},15000);
  peer.on('open',()=>{
    opened=true;clearTimeout(to);
    S.room=code;S.screen='lobby';requestWake();pushLobby();
  });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&tries<6&&!opened){clearTimeout(to);try{peer.destroy()}catch(x){}openPeer(tries+1);return}
    if(!opened){clearTimeout(to);hostFail('Could not create a room ('+e.type+'). Try again.')}
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('connection',conn=>{
    conn.on('data',m=>onClientMsg(conn,m));
    conn.on('close',()=>onClientGone(conn));
    conn.on('error',()=>onClientGone(conn));
  });
}
function hostFail(msg){cleanupNet();S.role='local';S.notice=msg;renderHome()}

function onClientMsg(conn,m){
  const pid=conn.peer;
  if(!m||typeof m!=='object') return;
  if(m.t==='hello'){
    if(S.players.some(p=>p.id===pid)) return;
    if(S.players.length>=16){sendTo(conn,{t:'bye',why:'The room is full.'});return}
    const cid=String(m.cid||'').slice(0,64);
    /* Reconnecting mid-auction: if this device previously owned a team that's now
       marked as left, hand that team straight back instead of leaving them a spectator. */
    if(S.A&&cid){
      const t=S.A.teams.find(x=>x.left&&x.cid===cid);
      if(t){
        t.owner=pid;t.human=true;t.left=false;
        S.players.push({id:pid,name:t.pname||'Player',cid});
        S.conns[pid]=conn;
        sendTo(conn,{t:'state',snap:snapshot()});
        renderTeams();renderDock();
        broadcast();
        return;
      }
    }
    let nm=String(m.name||'Player').replace(/\s+/g,' ').trim().slice(0,14)||'Player';
    const base=nm;let k=2;
    while(S.players.some(p=>p.name===nm)) nm=base.slice(0,12)+' '+(k++);
    S.players.push({id:pid,name:nm,cid});
    S.conns[pid]=conn;
    if(S.screen==='lobby') pushLobby();
    else if(S.A) sendTo(conn,{t:'state',snap:snapshot()});
    else sendTo(conn,lobbyMsg());
    return;
  }
  if(!S.players.some(p=>p.id===pid)) return;
  if(m.t==='claim'){doClaim(pid,m.team===null?null:Math.floor(+m.team))}
  else if(m.t==='bid'){
    const t=S.A&&S.A.teams.find(x=>x.owner===pid);
    const ok=t&&placeBid(t.id,+m.amt);
    if(!ok) sendTo(conn,{t:'state',snap:S.A?snapshot():null});
  }
  else if(m.t==='skip'){
    const t=S.A&&S.A.teams.find(x=>x.owner===pid);
    if(t) trySkip(t.id);
  }
}
function onClientGone(conn){
  const pid=conn.peer;
  if(!S.conns[pid]) return;
  delete S.conns[pid];
  S.players=S.players.filter(p=>p.id!==pid);
  if(S.screen==='lobby'){S.claims=S.claims.map(c=>c===pid?null:c);pushLobby();return}
  const A=S.A; if(!A) return;
  const now=performance.now();
  for(const t of A.teams){
    if(t.owner!==pid) continue;
    t.owner=null;t.human=false;t.left=true;
    const L=A.lot;
    if(L&&A.phase==='bidding'){
      L.botMax[t.id]=botValue(t,L.p);
      L.think[t.id]=(L.leader!==t.id&&L.botMax[t.id]>=L.next&&canBid(t,L.next))?now+rand(700,2000):Infinity;
      L.skip.delete(t.id);
      if(L.leader===null){
        const elig=A.teams.filter(x=>x.human&&!x.left&&active(x)&&L.leader!==x.id);
        if(elig.length&&elig.every(x=>L.skip.has(x.id))){closeLot();return}
      }
    }
  }
  if(S.screen==='auction'){renderTeams();renderDock()}
  broadcast();
}
function doClaim(pid,i){
  if(S.screen!=='lobby') return;
  if(i!==null&&(!Number.isInteger(i)||i<0||i>=S.cfg.teams)) return;
  if(i!==null&&S.claims[i]&&S.claims[i]!==pid) return;
  S.claims=S.claims.map(c=>c===pid?null:c);
  if(i!==null) S.claims[i]=pid;
  pushLobby();
}

/* Client side */
function joinRoom(code,name){
  const Peer=PeerClass();
  if(!Peer){joinMsg('Online rooms need PeerJS, which did not load in this browser.');return}
  cleanupNet();
  S.role='client';S.gone=false;S.me={id:null,name};
  joinMsg('Connecting…',true);
  let done=false;
  const fail=m=>{if(done)return;done=true;clearTimeout(to);cleanupNet();S.role='local';joinMsg(m)};
  const to=setTimeout(()=>fail("Couldn't reach that room. Check the code and try again."),15000);
  const peer=new Peer();
  S.net.peer=peer;
  peer.on('error',e=>{
    if(!done) fail(e.type==='peer-unavailable'?'No room with that code. Ask the host to check it.':'Connection problem ('+e.type+'). Try again.');
  });
  peer.on('open',id=>{
    S.me.id=id;
    const conn=peer.connect('castauction-'+code,{reliable:true,serialization:'json'});
    S.net.conn=conn;
    conn.on('open',()=>{
      if(done) return;
      done=true;clearTimeout(to);
      sendTo(conn,{t:'hello',name,cid:getClientId()});
      requestWake();
    });
    conn.on('data',onHostMsg);
    conn.on('close',onHostGone);
    conn.on('error',()=>{if(!done)fail("Couldn't connect to that room.");else onHostGone()});
  });
}
function onHostMsg(m){
  if(!m||typeof m!=='object') return;
  if(m.t==='lobby'){
    if(S.screen==='auction'||S.screen==='end'){clearInterval(S.timer);S.A=null}
    S.lobby=m;S.room=m.code||S.room;S.screen='lobby';renderLobby();window.scrollTo(0,0);
  } else if(m.t==='state'){
    if(m.snap) applySnapshot(m.snap);
  } else if(m.t==='bye'){
    onHostGone(m.why);
  }
}
function onHostGone(why){
  if(S.role!=='client'||S.gone) return;
  clearInterval(S.timer);
  if(S.screen==='end'){S.gone=true;renderEnd();return}
  const msg=why||'The host left, so the room has closed.';
  cleanupNet();S.A=null;S.role='local';S.screen='home';S.notice=msg;renderHome();
}

/* ---------- Auction setup ---------- */
function startAuction(){
  const c=S.cfg,room=S.role==='host';
  fixCfg(c);
  const teams=TEAMS.slice(0,c.teams).map((t,i)=>{
    let human,owner=null,pname='',cid=null;
    if(room){owner=S.claims[i]||null;human=!!owner;const pl=S.players.find(p=>p.id===owner);pname=pl?pl.name:'';cid=pl?pl.cid:null}
    else human=c.humans.filter(x=>x<c.teams).includes(i);
    return {id:i,name:t.name,color:t.color,home:t.home,human,owner,pname,cid,left:false,
      purse:c.purse,cast:[],aggr:0.85+Math.random()*0.4};
  });
  if(!teams.some(t=>t.human)) return;
  const pk=c.mode;
  const sorted=DATA[pk].slice().sort((a,b)=>b.r-a.r);
  const mq=sorted.length>20?8:3;
  const queue=shuffle(sorted.slice(0,mq)).concat(shuffle(sorted.slice(mq)));
  const sp=SPEEDS[c.speed];
  S.A={mode:c.mode,pool:pk,mq,teams,queue,idx:-1,round:1,unsold:[],results:[],lot:null,phase:'idle',
    deadline:0,total:1000,rem:0,t0:sp.t0*1000,t1:sp.t1*1000,hammerT:null,tab:'live',lastStatus:''};
  S.screen='auction';
  document.body.dataset.mode=c.mode;
  buildAuction();
  clearInterval(S.timer);
  S.timer=setInterval(tick,100);
  requestWake();
  nextLot();
  window.scrollTo(0,0);
}

/* ---------- Auction logic (local and host) ---------- */
function active(t){return t.purse>=0.5-1e-9}
function maxBid(t){return active(t)?t.purse:-Infinity}
function canBid(t,amt){return active(t)&&amt<=maxBid(t)+1e-9}
function nextText(A){
  const nx=A.queue[A.idx+1];
  return nx?'Up next: '+nx.n:(A.round===1&&A.unsold.length?'Unsold stars return for a second round':'Last lot');
}

function botValue(t,p){
  const A=S.A;
  if(!active(t)) return 0;
  let v=worth(p.r)*t.aggr*(0.8+Math.random()*0.4);
  if(p.ind===t.home) v*=1.18;
  const same=t.cast.filter(c=>c.p.type===p.type).length;
  if(t.cast.length>0&&same===0) v*=1.08;
  if(same>=2) v*=0.82;
  const remain=A.queue.length-A.idx-1;
  if(remain<=3) v*=1.4;
  return Math.min(v,t.purse*0.45+0.5);
}

function nextLot(){
  const A=S.A; if(!A||S.screen!=='auction') return;
  if(A.teams.every(t=>!active(t))) return finish();
  A.idx++;
  if(A.idx>=A.queue.length){
    const open=A.teams.some(t=>active(t));
    if(A.round===1&&A.unsold.length&&open){
      A.round=2;A.queue=shuffle(A.unsold);A.unsold=[];A.idx=0;
    } else return finish();
  }
  const p=A.queue[A.idx];
  const base=A.round===2?0.5:baseOf(p.r);
  const L={p,base,bid:null,leader:null,next:base,bids:[],botMax:{},think:{},skip:new Set(),marquee:A.round===1&&A.idx<A.mq};
  A.lot=L;
  const now=performance.now();
  for(const t of A.teams){
    if(t.human) continue;
    L.botMax[t.id]=botValue(t,p);
    L.think[t.id]=(L.botMax[t.id]>=base&&canBid(t,base))?now+rand(500,3200):Infinity;
  }
  A.deadline=now+A.t0;A.total=A.t0;A.phase='bidding';A.lastStatus='';
  updateLotView();updateBidView();renderDock();updateTimerView();
  if(!A.teams.some(t=>canBid(t,base))) closeLot();
  else broadcast();
}

function placeBid(tid,expect){
  const A=S.A;
  if(!A||A.phase!=='bidding') return false;
  const L=A.lot,t=A.teams[tid];
  if(!t||L.leader===tid||!canBid(t,L.next)) return false;
  if(expect!==undefined&&!(Math.abs(expect-L.next)<1e-9)) return false;
  const amt=L.next;
  L.bid=amt;L.leader=tid;L.bids.unshift({tid,amt});
  L.next=r2(amt+inc(amt));
  L.skip.delete(tid);
  const now=performance.now();
  A.deadline=now+A.t1;A.total=A.t1;
  for(const b of A.teams){
    if(b.human||b.id===tid) continue;
    L.think[b.id]=(L.botMax[b.id]>=L.next&&canBid(b,L.next))?now+rand(700,2400):Infinity;
  }
  updateBidView();renderDock();updateTimerView();
  broadcast();
  return true;
}

function trySkip(tid){
  const A=S.A;
  if(!A||A.phase!=='bidding') return false;
  const L=A.lot,t=A.teams[tid];
  if(!t||!t.human||L.leader===tid) return false;
  if(L.skip.has(tid)) return false;
  L.skip.add(tid);
  renderDock();
  broadcast();
  if(L.leader===null){
    const elig=A.teams.filter(x=>x.human&&!x.left&&active(x)&&L.leader!==x.id);
    if(elig.length&&elig.every(x=>L.skip.has(x.id))) closeLot();
  }
  return true;
}

function tick(){
  const A=S.A;if(!A||S.screen!=='auction'||A.phase!=='bidding') return;
  const now=performance.now();
  if(now>=A.deadline) return closeLot();
  const L=A.lot;
  for(const t of A.teams){
    if(t.human||t.id===L.leader||!active(t)) continue;
    if(now<(L.think[t.id]===undefined?Infinity:L.think[t.id])) continue;
    const willing=L.botMax[t.id]>=L.next&&canBid(t,L.next);
    if(willing&&Math.random()<0.85){placeBid(t.id);return}
    L.think[t.id]=willing?now+rand(400,1200):Infinity;
  }
  updateTimerView();
}

function closeLot(){
  const A=S.A,L=A.lot;if(A.phase==='hammer') return;
  A.phase='hammer';
  let stamp;
  if(L.leader!==null){
    const t=A.teams[L.leader];
    t.purse=r2(t.purse-L.bid);
    t.cast.push({p:L.p,price:L.bid});
    A.results.unshift({p:L.p,team:t.id,price:L.bid});
    stamp={kind:'sold',team:t,price:L.bid};
  } else {
    A.unsold.push(L.p);
    A.results.unshift({p:L.p,team:null});
    stamp={kind:'unsold'};
  }
  showStamp(stamp);updateTimerView();renderDock();renderTeams();renderLog();
  broadcast();
  A.hammerT=setTimeout(nextLot,2300);
}

function finish(){
  clearInterval(S.timer);
  if(S.A){clearTimeout(S.A.hammerT);S.A.phase='done'}
  S.screen='end';
  broadcast();
  renderEnd();window.scrollTo(0,0);
}

function togglePause(){
  const A=S.A;if(!A||S.role==='client') return;
  const now=performance.now();
  if(A.phase==='bidding'){A.rem=Math.max(0,A.deadline-now);A.phase='paused'}
  else if(A.phase==='paused'){
    A.deadline=now+A.rem;A.phase='bidding';
    const L=A.lot;
    for(const b of A.teams){if(!b.human&&b.id!==L.leader){
      L.think[b.id]=(L.botMax[b.id]>=L.next&&canBid(b,L.next))?now+rand(700,2000):Infinity;}}
  } else return;
  syncPauseUI();renderDock();updateTimerView();
  broadcast();
}
function syncPauseUI(){
  const paused=S.A.phase==='paused';
  const b=$('#pausebtn');if(b)b.textContent=paused?'Resume':'Pause';
  const p=$('#pausepanel');if(p)p.hidden=!paused;
}

function leaveAll(){
  clearInterval(S.timer);
  if(S.A) clearTimeout(S.A.hammerT);
  const peer=S.net.peer;
  if(S.role==='host') for(const id of Object.keys(S.conns)) sendTo(S.conns[id],{t:'bye',why:'The host closed the room.'});
  S.net.peer=null;
  const c=S.net.conn;S.net.conn=null;
  setTimeout(()=>{try{c&&c.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}},250);
  cleanupNet();
  S.A=null;S.role='local';S.gone=false;S.lobby=null;
  renderHome();window.scrollTo(0,0);
}
function backToLobby(){
  if(S.role!=='host') return;
  clearInterval(S.timer);
  if(S.A) clearTimeout(S.A.hammerT);
  S.A=null;S.screen='lobby';
  S.claims=S.claims.map(c=>c&&S.players.some(p=>p.id===c)?c:null);

/* ---------- Client mirror ---------- */
function snapshot(){
  const A=S.A,L=A.lot,now=performance.now();
  const rem=A.phase==='bidding'?Math.max(0,A.deadline-now):A.phase==='paused'?A.rem:0;
  return {mode:A.mode,pool:A.pool,round:A.round,idx:A.idx,qlen:A.queue.length,nextText:nextText(A),
    phase:A.phase,rem:Math.round(rem),total:A.total,
    teams:A.teams.map(t=>({id:t.id,name:t.name,color:t.color,home:t.home,human:t.human,owner:t.owner,pname:t.pname,
      left:!!t.left,purse:t.purse,cast:t.cast.map(c=>({pi:c.p.pi,price:c.price}))})),
    lot:L?{pi:L.p.pi,base:L.base,bid:L.bid,leader:L.leader,next:L.next,marquee:L.marquee,bids:L.bids.slice(0,4),skip:Array.from(L.skip)}:null,
    results:A.results.map(r=>({pi:r.p.pi,team:r.team,price:r.price}))};
}
function applySnapshot(s){
  const pool=DATA[s.pool||s.mode],prev=S.A;
  const A={mode:s.mode,pool:s.pool||s.mode,round:s.round,idx:s.idx,qlen:s.qlen,nextText:s.nextText,phase:s.phase,
    rem:s.rem,total:s.total||1000,deadline:performance.now()+s.rem,
    teams:s.teams.map(t=>Object.assign({},t,{cast:t.cast.map(c=>({p:pool[c.pi],price:c.price}))})),
    lot:s.lot?{p:pool[s.lot.pi],base:s.lot.base,bid:s.lot.bid,leader:s.lot.leader,next:s.lot.next,marquee:s.lot.marquee,bids:s.lot.bids,skip:new Set(s.lot.skip||[])}:null,
    results:s.results.map(r=>({p:pool[r.pi],team:r.team,price:r.price})),
    lastStatus:prev?prev.lastStatus:'',tab:prev?prev.tab:'live'};
  let newLot=!prev||prev.idx!==A.idx||prev.round!==A.round;
  const fresh=S.screen!=='auction'&&S.screen!=='end';
  S.A=A;
  if(s.phase==='done'){
    clearInterval(S.timer);
    S.screen='end';renderEnd();window.scrollTo(0,0);return;
  }
  if(fresh||S.screen==='end'){
    S.screen='auction';document.body.dataset.mode=A.mode;
    buildAuction();newLot=true;
    clearInterval(S.timer);
    S.timer=setInterval(()=>{if(S.screen==='auction'&&S.A)updateTimerView()},100);
    window.scrollTo(0,0);
  }
  if(newLot&&A.lot) updateLotView();
  updateBidView();renderDock();renderTeams();renderLog();syncPauseUI();updateTimerView();
  if(A.phase==='hammer'&&(newLot||!prev||prev.phase!=='hammer')&&A.results[0]) showStamp(stampFrom(A,A.results[0]));
}
function stampFrom(A,r){
  return r.team===null?{kind:'unsold'}:{kind:'sold',team:A.teams[r.team],price:r.price};
}

function updateTimerView(){
  const A=S.A;if(!A||!A.lot) return;
  const L=A.lot,now=performance.now();
  let rem=A.phase==='bidding'?Math.max(0,A.deadline-now):A.phase==='paused'?A.rem:0;
  const s=Math.ceil(rem/1000);
  $('#timerfill').style.width=(clamp(rem/A.total,0,1)*100)+'%';
  const hot=A.phase==='bidding'&&s<=3;
  $('#timerbar').classList.toggle('hot',hot);
  $('#clock').classList.toggle('hot',hot);
  $('#clock').textContent=s;

function renderDock(){
  const A=S.A,L=A.lot,el=$('#dockin');if(!el||!L) return;
  const hs=A.teams.filter(mine);
  $('#dock').className='dock '+(hs.length<=1?'one':'many');
  if(!hs.length){el.innerHTML='<p class="watch">You are watching this auction. Every team is on the Teams tab.</p>';return}
  el.innerHTML=hs.map(t=>{
    let label,dis=false;
    if(A.phase==='paused'){dis=true;label='Paused'}
    else if(A.phase!=='bidding'){dis=true;label='Hammer down'}
    else if(!active(t)){dis=true;label='Out of funds'}
    else if(L.leader===t.id){dis=true;label='Leading at '+cr(L.bid)}
    else if(!canBid(t,L.next)){dis=true;label='Over your limit'}
    else label='Bid '+cr(L.next);
    const skipped=L.skip&&L.skip.has(t.id);
    const skipDis=A.phase!=='bidding'||L.leader===t.id||skipped;
    return `<div class="dockteam">
      <button type="button" class="bidbtn" data-act="bid" data-t="${t.id}" style="--tc:${t.color}" ${dis?'disabled':''}>

        <span class="bp num">Purse ${cr(t.purse)}</span></button>
      <button type="button" class="skipbtn" data-act="skip" data-t="${t.id}" aria-pressed="${!!skipped}" ${skipDis?'disabled':''}>${skipped?'Skipped, waiting for others…':'Skip this star'}</button>
    </div>`}).join('');
}

      <div class="team-h"><div><h3>${esc(t.name)}</h3><p>${ownerLabel(t)}, home crowd ${IND[t.home]}</p></div>
        <div class="purse"><b class="num">${cr(t.purse)}</b><span>${t.cast.length} signed</span></div></div>
      <ul class="squad">${t.cast.map(c=>`<li><span>${esc(c.p.n)}</span><em class="num">${cr(c.price)}</em></li>`).join('')||'<li class="empty">No stars signed yet</li>'}</ul>
    </article>`).join('');
}

function renderLog(){
  const A=S.A,el=$('#tab-log');if(!el) return;
  if(!A.results.length){el.innerHTML='<p class="emptymsg">Sold and unsold stars will show up here.</p>';return}
  el.innerHTML='<ul class="log">'+A.results.map(r=>{
    if(r.team===null) return `<li class="un"><span>${esc(r.p.n)}</span><em>Unsold</em></li>`;
    const t=A.teams[r.team];
    return `<li><span>${esc(r.p.n)}</span><em class="num"><span style="color:${t.color}">${esc(t.name)}</span> for ${cr(r.price)}</em></li>`;
  }).join('')+'</ul>';
}

/* ---------- End ---------- */
function score(t){
  const base=t.cast.reduce((s,c)=>s+c.p.r,0);
  const types=new Set(t.cast.map(c=>c.p.type)).size;
  const variety=Math.max(0,types-1)*4;
  const homeN=t.cast.filter(c=>c.p.ind===t.home).length;
  const home=homeN*2;
  const purse=r2(t.purse*0.2);
  return {base,types,variety,homeN,home,purse,total:r2(base+variety+home+purse)};
}
function resultsText(){
  const A=S.A;
  const ranked=A.teams.map(t=>({t,s:score(t)})).sort((a,b)=>b.s.total-a.s.total);
  return `Cast Auction, ${POOLNAME[A.pool]}\n`+ranked.map((x,i)=>`${i+1}. ${x.t.name}${x.t.human&&x.t.pname?' ('+x.t.pname+')':''}: ${x.s.total} points (${x.t.cast.map(c=>c.p.n).join(', ')||'no cast'})`).join('\n');
}
function renderEnd(){
  const A=S.A;
  const ranked=A.teams.map(t=>({t,s:score(t)})).sort((a,b)=>b.s.total-a.s.total);
  const w=ranked[0];
  document.body.dataset.mode=A.mode;
  let foot;
  if(S.role==='local') foot='<button type="button" class="go" data-act="again">Play again</button>';
  else if(S.role==='host') foot='<button type="button" class="go" data-act="lobby">Back to the lobby</button><button type="button" class="ghost" data-act="leave">Close room</button>';
  else foot=S.gone?'<p class="notice">The host has left the room.</p><button type="button" class="go" data-act="leave">Back to home</button>'
                  :'<p class="waiting" role="status">Waiting for the host to start another round</p><button type="button" class="ghost" data-act="leave">Leave room</button>';
  const who=t=>t.human?(t.pname?esc(t.pname):'a human team'):'a bot team';
  app.innerHTML=`
  <h1 class="brand" style="font-size:clamp(34px,10vw,52px)">That's a wrap</h1>
  <div class="win">
    <p class="muted">Best cast</p>
    <h2 style="color:${w.t.color}">${esc(w.t.name)}</h2>
    <p class="sc num">${w.s.total} points, ${S.role==='local'?(w.t.human?'a human team':'a bot team'):'played by '+(w.t.human?who(w.t):'a bot')}</p>
  </div>
  ${ranked.map((x,i)=>`
  <details class="rank" style="--tc:${x.t.color}" ${i===0?'open':''}>
    <summary><span class="pos">${i+1}</span>
      <span class="rn"><b>${esc(x.t.name)}</b><span>${S.role==='local'?(x.t.human?'Human':'Bot'):ownerLabel(x.t)}, ${x.t.cast.length} signed</span></span>
      <span class="tot num">${x.s.total}</span></summary>
    <div class="body">
      <div class="break num">
        <span>Cast ratings</span><b>${x.s.base}</b>
        <span>Variety bonus (${x.s.types} types)</span><b>+${x.s.variety}</b>
        ${A.pool.endsWith('_en')?'':`<span>Home crowd bonus (${x.s.homeN} ${IND[x.t.home]} stars)</span><b>+${x.s.home}</b>`}
        <span>Unspent purse (${cr(x.t.purse)})</span><b>+${x.s.purse}</b>
      </div>
      <ul class="squad">${x.t.cast.map(c=>`<li><span>${esc(c.p.n)}</span><em class="num">${cr(c.price)}</em></li>`).join('')||'<li class="empty">Nobody signed</li>'}</ul>
    </div>
  </details>`).join('')}
  ${foot}
  <button type="button" class="ghost" data-act="copy" id="copybtn">Copy results</button>
  <button type="button" class="ghost" data-act="download">Download results</button>
  <div id="copyarea"></div>`;
}
function downloadResults(){
  const txt=resultsText();
  const blob=new Blob([txt],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='cast-auction-results.txt';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function copyResults(){
  const txt=resultsText();
  try{await navigator.clipboard.writeText(txt);$('#copybtn').textContent='Copied';return}catch(e){}
  $('#copyarea').innerHTML=`<textarea class="copybox" readonly aria-label="Results text">${esc(txt)}</textarea>`;
  const ta=$('#copyarea textarea');ta.focus();ta.select();
  $('#copybtn').textContent='Select the text below to copy';
}

/* ---------- Events ---------- */
const ACT={
  home(){if(S.role!=='local')leaveAll();else renderHome()},
  hostroom(){hostRoom()},
  joinscreen(){renderJoin('')},
  join(){
    const code=($('#codeIn').value||'').toUpperCase().replace(/[^A-Z]/g,'');
    const name=readName();
    S.pendingCode=code;
    if(code.length!==4){joinMsg('Enter the 4 letter code the host shows.');return}
    joinRoom(code,name);
  },
  setup(){S.role='local';renderSetup()},
  mode(d){S.cfg.mode=d.v;fixCfg(S.cfg);cfgChanged()},
  step(d){const c=S.cfg;c.teams+= +d.d;fixCfg(c);cfgChanged()},
  purse(d){S.cfg.purse=+d.v;cfgChanged()},
  speed(d){S.cfg.speed=d.v;cfgChanged()},
  who(d){
    const i=+d.i,h=S.cfg.humans;
    if(d.v==='human'){if(!h.includes(i))h.push(i)}
    else S.cfg.humans=h.filter(x=>x!==i);
    renderSetup();
  },
  start(){S.role='local';startAuction()},
  startroom(){if(S.role==='host')startAuction()},
  claim(d){claimAct(d)},
  invite(){copyInvite()},
  bid(d){
    if(S.role==='client'){
      const L=S.A&&S.A.lot;if(!L||S.A.phase!=='bidding') return;
      sendHost({t:'bid',amt:L.next});
      document.querySelectorAll('.bidbtn').forEach(b=>{b.disabled=true});
    } else placeBid(+d.t);
  },
  skip(d){
    if(S.role==='client'){
      const L=S.A&&S.A.lot;if(!L||S.A.phase!=='bidding') return;
      sendHost({t:'skip'});
    } else trySkip(+d.t);
  },
  pause(){togglePause()},
  tab(d){showTab(d.v)},
  leave(){leaveAll()},
  lobby(){backToLobby()},
  again(){S.A=null;renderSetup();window.scrollTo(0,0)},
  copy(){copyResults()},
  download(){downloadResults()}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t) return;
  const f=ACT[t.dataset.act];if(f) f(t.dataset);
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='codeIn') e.target.value=e.target.value.toUpperCase().replace(/[^A-Za-z]/g,'').toUpperCase();
});

/* ---------- Boot ---------- */
(function boot(){
  const m=/^#([A-Za-z]{4})$/.exec(location.hash||'');
  if(m) renderJoin(m[1].toUpperCase());
  else renderHome();
})();

</script>
</body>
</html>
